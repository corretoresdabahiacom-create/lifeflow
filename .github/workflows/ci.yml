name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  supabase-integration:
    name: Supabase real (GoTrue + PostgREST + RLS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
      # Mesma suíte do Worker (finanças, agenda, IA, cobrança, conta, segurança), mas com a pilha Supabase de verdade:
      # as migrações de supabase/migrations, GoTrue emitindo os JWTs e o PostgREST verificando a assinatura e aplicando a RLS.
      - run: pnpm test:integration

  supabase-recovery:
    name: Recuperação (pg_dump -> perda total -> pg_restore)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: bash supabase/scripts/recovery-test.sh
