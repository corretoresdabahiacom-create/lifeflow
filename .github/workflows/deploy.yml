name: Deploy

# Deploy MANUAL e com aprovação (proteção do "environment" no GitHub). Produção só a partir de `main`.
# ATENÇÃO: este workflow NUNCA foi executado (não havia contas Cloudflare/Supabase). Faça o primeiro deploy em staging.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Ambiente de destino"
        type: choice
        options: [staging, production]
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  verify:
    name: verificação completa antes do deploy
    runs-on: ubuntu-latest
    steps:
      - name: Produção só sai de main
        if: inputs.environment == 'production' && github.ref != 'refs/heads/main'
        run: |
          echo "Deploy de produção só é permitido a partir da branch main." >&2
          exit 1
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration

  deploy:
    name: deploy (${{ inputs.environment }})
    needs: verify
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # 1) Migrações do banco PRIMEIRO: o Worker novo depende do esquema, da RLS e das funções lf_*.
      #    Só migrações novas e aditivas; `db push` recusa aplicar fora de ordem. Faça backup antes (docs/BACKUP_RECOVERY.md).
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Migrações do Supabase
        run: |
          supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
          supabase db push --yes

      # 2) API (Worker). Segredos (chaves de IA, Mercado Pago, chave secreta do Supabase) ficam no Cloudflare:
      #    `wrangler secret put <NOME>` — nunca neste arquivo (ver docs/DEPLOYMENT.md).
      - name: Worker da API
        working-directory: workers/api
        run: >
          pnpm exec wrangler deploy
          --var SUPABASE_URL:${{ vars.SUPABASE_URL }}
          --var SUPABASE_PUBLISHABLE_KEY:${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          --var ALLOWED_ORIGIN:${{ vars.WEB_BASE_URL }}
          --var WEB_BASE_URL:${{ vars.WEB_BASE_URL }}
          --var API_PUBLIC_URL:${{ vars.API_PUBLIC_URL }}

      # 3) App web (Cloudflare Pages).
      - name: Build do app web
        run: pnpm --filter @lifeflow/web build
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          VITE_API_BASE_URL: ${{ vars.API_PUBLIC_URL }}
      - name: Publicar no Cloudflare Pages
        run: pnpm --filter @lifeflow/web exec wrangler pages deploy dist --project-name "${{ vars.PAGES_PROJECT }}" --branch "${{ inputs.environment == 'production' && 'main' || 'staging' }}"

      # 4) Verificação pós-deploy: se falhar, reverter (docs/RUNBOOK.md, "Rollback").
      - name: Smoke test
        run: bash scripts/smoke.sh "${{ vars.API_PUBLIC_URL }}" "${{ vars.WEB_BASE_URL }}"
