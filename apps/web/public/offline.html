<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LifeFlow AI — sem conexão</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f6f7fb; color: #171a26; text-align: center;
      }
      @media (prefers-color-scheme: dark) { body { background: #0f1117; color: #eceef6; } }
      main { max-width: 420px; }
      h1 { margin: 0 0 8px; font-size: 1.5rem; }
      p { margin: 0 0 20px; line-height: 1.5; opacity: 0.8; }
      button {
        font: inherit; font-weight: 600; padding: 12px 18px; border-radius: 10px; border: 0;
        background: #4f46e5; color: #fff; cursor: pointer; min-height: 44px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Você está sem conexão</h1>
      <p>Seus dados pessoais não ficam salvos neste aparelho para uso offline. Reconecte-se à internet para continuar.</p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
