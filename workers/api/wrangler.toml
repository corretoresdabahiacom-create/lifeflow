name = "lifeflow-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Nenhum destes valores é segredo (a chave PUBLICÁVEL do Supabase é pública por desenho).
# Substitua pelos do projeto Supabase real no deploy. O acesso aos dados usa o JWT do usuário + RLS;
# a chave secreta (SUPABASE_SECRET_KEY, `wrangler secret put`) só alcança uma lista fechada de caminhos (system.ts).
[vars]
SUPABASE_URL = "https://demo-lifeflow.supabase.co"
SUPABASE_PUBLISHABLE_KEY = "sb_publishable_demo"
ALLOWED_ORIGIN = "http://localhost:5173"

# Para desenvolvimento local com `supabase start`, use .dev.vars (ignorado pelo Git):
#   SUPABASE_URL=http://127.0.0.1:54321
#   SUPABASE_PUBLISHABLE_KEY=<chave de `supabase status`>
#   SUPABASE_SECRET_KEY=<chave de `supabase status`>
